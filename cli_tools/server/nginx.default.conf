# NGINX config to serve the Godot Web (WASM) build with the same headers as serve.py

server {
    listen       80;
    server_name  _;

    # Root points to the mounted build folder
    root /usr/share/nginx/html;
    index index.html;

    # Replicate serve.py security/CORS headers (needed for SharedArrayBuffer / threads)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Base image already includes /etc/nginx/mime.types in the http context.
    # Add explicit content-types for critical asset extensions.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
    location ~* \.(pck|zip)$ {
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Gzip for common text assets (optional but useful)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/manifest+json;

    # Serve files or fall back to index.html (useful if routing is added)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
