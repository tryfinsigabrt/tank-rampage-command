services:
  web:
    image: nginx:1.29-alpine
    container_name: trc-web-wasm
    ports:
      - "8080:80"
    volumes:
      # Mount the Godot web build output so changes are picked up live (no rebuild needed)
      - ./project/build/web:/usr/share/nginx/html:ro
      # Mount our nginx server config that replicates serve.py headers
      - ./cli_tools/server/nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
